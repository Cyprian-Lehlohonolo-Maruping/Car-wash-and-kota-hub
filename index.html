<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasi Wash & Kota Hub</title>
    <style>
        :root {
            --primary: #ff6b00;
            --secondary: #1a1a1a;
            --accent: #25d366;
            --bg: #f9f9f9;
            --text: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 50px;
        }
        header {
            background: var(--secondary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }
        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.9rem;
            color: #ccc;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--secondary);
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        .menu-grid, .service-grid {
            display: grid;
            gap: 10px;
        }
        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            transition: 0.2s;
        }
        .item-card:hover {
            border-color: var(--primary);
        }
        .item-info h3 {
            font-size: 1rem;
            color: var(--secondary);
        }
        .item-info p {
            font-size: 0.85rem;
            color: #666;
        }
        .item-price {
            font-weight: bold;
            color: var(--primary);
            font-size: 1rem;
        }
        .item-card input[type="checkbox"] {
            transform: scale(1.3);
            accent-color: var(--primary);
            cursor: pointer;
        }
        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        form input, form select, form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .admin-section {
            background: #1a1a1a;
            color: white;
            text-align: center;
        }
        .admin-section h2 {
            color: white;
            border-left-color: var(--primary);
        }
        .admin-controls {
            display: none;
        }
        .pin-box input {
            text-align: center;
            letter-spacing: 5px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Kasi Wash & Kota Hub</h1>
        <p>Sparkling Clean Cars & Delicious Kasi Kotas!</p>
    </header>

    <div class="container">

        <!-- SERVICES & MENU SELECTION -->
        <div class="section">
            <h2>Select Car Wash & Food</h2>
            <div id="order-form">
                
                <h3 style="font-size: 1rem; margin-bottom: 10px; color: #555;">Car Wash Services</h3>
                <div class="service-grid" style="margin-bottom: 20px;">
                    <label class="item-card">
                        <div class="item-info">
                            <h3>Full Wash</h3>
                            <p>Wash, Vacuum & Dry</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span class="item-price">R80</span>
                            <input type="checkbox" class="order-item" data-name="Full Wash" data-price="80">
                        </div>
                    </label>
                    <label class="item-card">
                        <div class="item-info">
                            <h3>Engine Wash</h3>
                            <p>Deep degrease & clean</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span class="item-price">R50</span>
                            <input type="checkbox" class="order-item" data-name="Engine Wash" data-price="50">
                        </div>
                    </label>
                </div>

                <h3 style="font-size: 1rem; margin-bottom: 10px; color: #555;">Kota Menu</h3>
                <div class="menu-grid" style="margin-bottom: 20px;">
                    <label class="item-card">
                        <div class="item-info">
                            <h3>The Classic Kota</h3>
                            <p>Polony, Chips, Atchar, Cheese</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span class="item-price">R35</span>
                            <input type="checkbox" class="order-item" data-name="Classic Kota" data-price="35">
                        </div>
                    </label>
                    <label class="item-card">
                        <div class="item-info">
                            <h3>The Beast Kota</h3>	
                            <p>Russian, Egg, Cheese, Polony, Chips</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span class="item-price">R55</span>
                            <input type="checkbox" class="order-item" data-name="Beast Kota" data-price="55">
                        </div>
                    </label>
                </div>

                <!-- CUSTOMER DETAILS -->
                <h2>Your Details</h2>
                <label for="cust-name">Full Name</label>
                <input type="text" id="cust-name" placeholder="Enter your name">

                <label for="cust-note">Special Instructions / Car Model</label>
                <textarea id="cust-note" rows="2" placeholder="e.g. White VW Polo, extra atchar"></textarea>

                <button class="btn" onclick="sendWhatsAppOrder()">Send Order via WhatsApp</button>
            </div>
        </div>

        <!-- ADMIN PORTAL -->
        <div class="section admin-section">
            <h2>Owner Portal</h2>
            
            <div id="pin-login" class="pin-box">
                <p style="margin-bottom: 10px; font-size: 0.9rem; color: #ccc;">Enter Admin PIN to Access</p>
                <input type="password" id="admin-pin" maxlength="4" placeholder="••••">
                <button class="btn" style="background: var(--primary);" onclick="verifyPin()">Login</button>
            </div>

            <div id="admin-dashboard" class="admin-controls">
                <p style="color: var(--accent); margin-bottom: 15px; font-weight: bold;">✔ Admin Verified (PIN: 1472)</p>
                <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 15px;">You can update your business notice board or active status below:</p>
                <textarea id="admin-announcement" rows="3" placeholder="e.g. Open for business! Special on Beast Kotas today.">Open for business!</textarea>
                <button class="btn" style="background: var(--primary);" onclick="saveNotice()">Update Status</button>
            </div>
        </div>

    </div>

    <script>
        function sendWhatsAppOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const note = document.getElementById('cust-note').value.trim();
            const checkboxes = document.querySelectorAll('.order-item:checked');

            if (!name) {
                alert('Please enter your name before sending the order.');
                return;
            }
            if (checkboxes.length === 0) {
                alert('Please select at least one car wash service or kota item.');
                return;
            }

            let orderList = "";
            let total = 0;
            checkboxes.forEach(item => {
                const itemName = item.getAttribute('data-name');
                const itemPrice = parseFloat(item.getAttribute('data-price'));
                orderList += `- ${itemName} (R${itemPrice})\n`;
                total += itemPrice;
            });

            const message = `*New Order - Kasi Wash & Kota Hub*\n\n*Customer:* ${name}\n*Items:*\n${orderList}\n*Total:* R${total}\n*Notes:* ${note || 'None'}`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappNumber = '27794789949';

            window.location.href = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
        }

        function verifyPin() {
            const enteredPin = document.getElementById('admin-pin').value;
            if (enteredPin === '1472') {
                document.getElementById('pin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            } else {
                alert('Incorrect PIN!');
                document.getElementById('admin-pin').value = '';
            }
        }

        function saveNotice() {
            alert('Business status updated successfully!');
        }
    </script>
</body>
</html>
